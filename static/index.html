<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Medical RAG Agent Demo</title>
  <style>
    :root { --bg:#0f1419; --card:#1a2332; --text:#e7ecf3; --muted:#9aa7b8; --accent:#3d9cf0; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Segoe UI", "PingFang SC", sans-serif; background:linear-gradient(160deg,#0f1419,#182433); color:var(--text); min-height:100vh; }
    main { max-width: 860px; margin: 0 auto; padding: 32px 20px 60px; }
    h1 { font-size: 1.45rem; margin: 0 0 8px; }
    .sub { color: var(--muted); font-size: 0.92rem; margin-bottom: 20px; line-height: 1.5; }
    .card { background: var(--card); border: 1px solid #2a384c; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    textarea { width:100%; min-height: 90px; border-radius: 10px; border:1px solid #33455f; background:#101826; color:var(--text); padding:12px; font-size:1rem; resize: vertical; }
    button { background: var(--accent); color:#fff; border:0; border-radius: 10px; padding: 10px 18px; font-size: 0.95rem; cursor:pointer; margin-top: 10px; }
    button:disabled { opacity: 0.6; cursor: wait; }
    pre { white-space: pre-wrap; word-break: break-word; background:#101826; padding:12px; border-radius:10px; font-size:0.88rem; line-height:1.45; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .chip { font-size:0.8rem; background:#243247; border:1px solid #35506f; color:#cfe3ff; border-radius:999px; padding:6px 10px; cursor:pointer; }
    .tag { display:inline-block; font-size:0.75rem; color:#8fd3ff; margin-bottom:8px; }
  </style>
</head>
<body>
  <main>
    <h1>家用医疗 × 课题知识 RAG Agent</h1>
    <p class="sub">求职 Demo：LangChain 工具调用 + Chroma 检索 + FastAPI。内容为科普/课题摘要，非诊疗建议。</p>
    <div class="card">
      <textarea id="q" placeholder="例如：血压 135/85 算高吗？"></textarea>
      <div class="chips" id="chips"></div>
      <button id="go">提问</button>
    </div>
    <div class="card">
      <div class="tag" id="mode"></div>
      <pre id="ans">等待提问…</pre>
    </div>
    <div class="card">
      <div class="tag">工具轨迹 / 检索来源</div>
      <pre id="meta"></pre>
    </div>
  </main>
  <script>
    const samples = [
      "血压 135/85 算高吗？该怎么测更准？",
      "空腹血糖 6.5 mmol/L 需要注意什么？",
      "智能客服能不能直接给人开降压药？",
      "Residual-DPLS 公开基准大概多少 R²？",
      "GDSC 药敏实验大概用了多少样本？"
    ];
    const chips = document.getElementById('chips');
    samples.forEach(s => {
      const el = document.createElement('span');
      el.className = 'chip'; el.textContent = s;
      el.onclick = () => { document.getElementById('q').value = s; };
      chips.appendChild(el);
    });
    document.getElementById('go').onclick = async () => {
      const question = document.getElementById('q').value.trim();
      if (!question) return;
      const btn = document.getElementById('go');
      btn.disabled = true; btn.textContent = '思考中…';
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({question})
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
        document.getElementById('mode').textContent = '模式：' + data.mode;
        document.getElementById('ans').textContent = data.answer;
        document.getElementById('meta').textContent =
          'tool_traces = ' + JSON.stringify(data.tool_traces, null, 2) +
          '\n\ncontexts = ' + JSON.stringify(data.contexts, null, 2);
      } catch (e) {
        document.getElementById('ans').textContent = '错误：' + e.message;
      } finally {
        btn.disabled = false; btn.textContent = '提问';
      }
    };
  </script>
</body>
</html>
